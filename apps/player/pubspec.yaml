name: player
description: Flutter mobile renderer app for A2UI Flow Studio.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flow_core:
    path: ../../packages/flow_core
  flow_compiler:
    path: ../../packages/flow_compiler
  a2ui_core: 0.7.0
  a2ui_flutter: 0.3.0
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  json_schema_builder: ^0.1.7
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

